name: Refresh inflation data

# The IMF publishes its World Economic Outlook in April and October, with updates in
# January and July. Run early in the following month each quarter, and on demand.
on:
  schedule:
    - cron: '41 14 3 2,5,8,11 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-inflation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: data/inflation-refresh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only rewrites src/data/inflation.json when the IMF numbers changed.
      - name: Download IMF inflation
        run: npm run data:inflation

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/inflation.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new inflation data." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data/inflation.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test with the new data
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add src/data/inflation.json
          git commit -m "Refresh IMF inflation data ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "Refresh IMF inflation data" \
              --body "Automated quarterly refresh of \`src/data/inflation.json\` from the IMF World Economic Outlook (PCPIPCH). Tests and build passed with the new data. Merging redeploys the site."
          fi
