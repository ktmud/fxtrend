name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild on weekday evenings (UTC), after the ECB publishes the day's reference rates,
  # so the bundled snapshot stays fresh even if nobody pushes.
  schedule:
    - cron: '23 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Refresh the bundled data. If a source is down, keep the committed snapshot.
      - name: Refresh exchange-rate snapshot
        run: npm run data:fx
        continue-on-error: true
      - name: Refresh inflation data
        run: npm run data:inflation
        continue-on-error: true

      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
